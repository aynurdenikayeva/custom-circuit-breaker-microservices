server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: order-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

services:
  inventory:
    base-url: http://inventory-service
  payment:
    base-url: http://payment-service

management:
  endpoints:
    web:
      exposure:
        include: health,info